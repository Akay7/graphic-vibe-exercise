<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graphic Vibe Exercise</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="demo-page">
      <section class="demo-version">
        <h2 class="demo-version-title">Version 1 <small>custom SVG + d3-scale (TimeSeriesChart)</small></h2>
        <div class="demo-topbar"></div>
        <div class="demo-row">
          <div class="demo-sidebar">
            <div class="demo-cell demo-cell-header">Tdy</div>
            <div class="demo-cell">0%</div>
            <div class="demo-cell">$0</div>
            <div class="demo-cell">$0</div>
            <div class="demo-cell">0</div>
            <div class="demo-cell">0</div>
            <div class="demo-cell">—</div>
          </div>
          <div id="chart-custom" class="demo-chart"></div>
          <button class="demo-edit" type="button" aria-label="Edit">✎<span>▾</span></button>
        </div>
      </section>

      <section class="demo-version">
        <h2 class="demo-version-title">Version 2 <small>Highcharts (createHighchartsComboChart)</small></h2>
        <div class="demo-topbar"></div>
        <div class="demo-row">
          <div class="demo-sidebar">
            <div class="demo-cell demo-cell-header">Tdy</div>
            <div class="demo-cell">0%</div>
            <div class="demo-cell">$0</div>
            <div class="demo-cell">$0</div>
            <div class="demo-cell">0</div>
            <div class="demo-cell">0</div>
            <div class="demo-cell">—</div>
          </div>
          <div id="chart-highcharts" class="demo-chart"></div>
          <button class="demo-edit" type="button" aria-label="Edit">✎<span>▾</span></button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
